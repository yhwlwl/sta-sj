name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check JavaScript syntax
        run: |
          node --check server.cjs
          node --check scifi.cjs
          node --check student.js
          node --check works.js
      - run: npm ci
      - run: npm test
      - name: Verify generated Pages worker
        run: |
          python3 build-worker.py
          git diff --exit-code -- _worker.js
